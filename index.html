<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Géolocalisation tp 4</title>
    <style>
        /* On définit la taille de l'écran */
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial;
        }

        #controls {
            padding: 10px;
            background: #f4f4f4;
            border-bottom: 1px solid #ccc;
        }

        #map_canvas {
            height: 70%;
            width: 100%;
        }

        #stats {
            height: 20%;
            padding: 10px;
            overflow-y: auto;
            font-size: 14px;
        }

        .valeur {
            font-weight: bold;
            color: blue;
        }
    </style>

    <script src="https://maps.googleapis.com/maps/api/js"></script>
</head>

<body onload="initialize()">

    <div id="controls">
        <label>Type de carte : </label>
        <select id="mapType" onchange="changeMapType()">
            <option value="roadmap">Roadmap</option>
            <option value="satellite">Satellite</option>
            <option value="hybrid">Hybride</option>
        </select>
    </div>

    <div id="map_canvas"></div>

    <div id="stats">
        <strong>Données en temps réel :</strong><br>
        Latitude: <span id="lat" class="valeur">-</span> |
        Longitude: <span id="lon" class="valeur">-</span> |
        Précision: <span id="acc" class="valeur">-</span> m<br>
        Angle (Direction): <span id="heading" class="valeur">-</span>° |
        Vitesse: <span id="speed" class="valeur">-</span> m/s<br>
        Dernière MAJ: <span id="time" class="valeur">-</span>
    </div>

    <script>
        var map;
        var marker;
        var previousPosition = null;

        function initialize() {
            // Configuration initiale de la carte
            var optionsDeLaCarte = {
                zoom: 15,
                center: new google.maps.LatLng(0, 0),
                mapTypeId: google.maps.MapTypeId.ROADMAP
            };

            map = new google.maps.Map(document.getElementById("map_canvas"), optionsDeLaCarte);
            marker = new google.maps.Marker({ map: map, title: "Vous êtes ici" });

            // Lancer la surveillance
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(successCallback, errorCallback, {
                    enableHighAccuracy: true,
                    maximumAge: 0
                });
            } else {
                alert("Géolocalisation non supportée");
            }
        }

        // Fonction pour changer le type de carte via le menu
        function changeMapType() {
            var typeSelectionne = document.getElementById("mapType").value;
            map.setMapTypeId(typeSelectionne);
        }

        function successCallback(position) {
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;
            var angle = position.coords.heading;
            var vitesse = position.coords.speed;
            var nllePos = new google.maps.LatLng(lat, lon);

            // Mise à jour de l'affichage texte
            document.getElementById('lat').innerHTML = lat.toFixed(6);
            document.getElementById('lon').innerHTML = lon.toFixed(6);
            document.getElementById('acc').innerHTML = position.coords.accuracy;
            document.getElementById('heading').innerHTML = (angle !== null) ? angle : "N/A";
            document.getElementById('speed').innerHTML = (vitesse !== null) ? vitesse : "0";
            document.getElementById('time').innerHTML = new Date().toLocaleTimeString();

            // Mise à jour du marqueur et centrage
            map.panTo(nllePos);
            marker.setPosition(nllePos);

            // Dessiner le tracé
            if (previousPosition) {
                var path = [
                    new google.maps.LatLng(previousPosition.coords.latitude, previousPosition.coords.longitude),
                    nllePos
                ];
                new google.maps.Polyline({
                    path: path,
                    strokeColor: "#FF0000",
                    strokeWeight: 3,
                    map: map
                });
            }
            previousPosition = position;
        }

        function errorCallback(err) {
            console.error("Erreur de position : " + err.message);
        }
    </script>
</body>

</html>
